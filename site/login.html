<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Battle Hub | Login</title>

  <script src="sessao.js"></script>

  <link rel="stylesheet" href="estilo.css" />
</head>

<body class="fundo-capa">

  <!--Header-->
  <div class="header">
    <div class="container">
      <h1 class="titulo">Battle<span>Hub</span></h1>
      <ul class="navbar">
        <li>
          <a href="index.html">Inicial</a>
        </li>
        <li>
          <a href="historia.html">Minha História</a>
        </li>
        <li>|</li>
        <span id="nav_conta" style="display:contents">
          <li class="agora">
            <a href="#">Login</a>
          </li>
          <li>
            <a href="cadastro.html">Cadastro</a>
          </li>
        </span>
      </ul>
    </div>
  </div>

  <div class="login">
    <div class="alerta_erro">
      <div class="card_erro" id="cardErro">
        <span id="mensagem_erro"></span>
      </div>
    </div>
    <div class="container">
      <div class="card card-login">
        <h2>Olá de volta!</h2>
        <div class="formulario">
          <div class="campo">
            <span>E-mail:</span>
            <input id="email_input" type="text" placeholder="meuemail@provedor.com" />
          </div>
          <div class="campo">
            <span>Senha:</span>
            <input id="senha_input" type="password" placeholder="******" />
          </div>
          <button class="botao" onclick="entrar()">Entrar</button>
        </div>

        <div id="div_aguardar" class="loading-div">
          <div class="spinner"></div>
        </div>

        <div id="div_erros_login"></div>

        <p class="troca">Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
      </div>
    </div>
  </div>

  <!--footer inicio-->
  <div class="footer">
    <div class="container">
      <h4>Site de fãs, não oficial. Fortnite é marca da Epic Games. &copy; 2026</h4>
      <h4>Imagens do jogo &copy; Epic Games, Inc., usadas apenas em projeto escolar sem fins lucrativos.</h4>
    </div>
  </div>
  <!--footer fim-->

</body>

</html>

<script>

  function entrar() {
    aguardar();

    var emailVar = email_input.value;
    var senhaVar = senha_input.value;

    if (emailVar == "" || senhaVar == "") {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML = "Preencha o e-mail e a senha para entrar.";
      setTimeout(sumirMensagem, 5000);
      finalizarAguardar();
      return false;
    }

    console.log("FORM LOGIN: ", emailVar);

    fetch("/usuarios/autenticar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        emailServer: emailVar,
        senhaServer: senhaVar
      })
    }).then(function (resposta) {
      console.log("ESTOU NO THEN DO entrar()!");

      if (resposta.ok) {
        console.log(resposta);

        resposta.json().then(json => {
          console.log(json);
          console.log(JSON.stringify(json));
          sessionStorage.EMAIL_USUARIO = json.email;
          sessionStorage.NOME_USUARIO = json.nome;
          sessionStorage.ID_USUARIO = json.id;
          sessionStorage.AQUARIOS = JSON.stringify(json.aquarios);

          setTimeout(function () {
            // Para usar o dashboard do projeto original, troque por "./dashboard/cards.html"
            window.location = "painel.html";
          }, 1000); // apenas para exibir o loading
        });

      } else {

        console.log("Houve um erro ao tentar realizar o login!");

        resposta.text().then(texto => {
          console.error(texto);
          finalizarAguardar(texto);
        });
      }

    }).catch(function (erro) {
      console.log(erro);
      finalizarAguardar("Não foi possível conectar ao servidor.");
    });

    return false;
  }

  function sumirMensagem() {
    cardErro.style.display = "none";
  }

</script>
